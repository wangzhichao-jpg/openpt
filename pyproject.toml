[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openpt"
version = "0.2.1"
description = "能力验证统计工作台原型，不可用于正式评价"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "Apache-2.0"}
classifiers = ["License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3"]
dependencies = ["numpy>=1.26.4,<3", "scipy>=1.11.4,<2", "openpyxl>=3.1.5,<4", "python-docx>=1.2.0,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=6,<8", "hypothesis>=6,<7", "mypy>=1,<3"]
crosscheck = ["pt13528==0.1.11"]
plot = ["matplotlib>=3.8,<4"]

[project.scripts]
openpt = "openpt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["openpt*"]

[tool.setuptools.package-data]
openpt = ["config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["internal: 需要仓库外内部材料", "r: 需要 Rscript 独立对照环境"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
# 中文标点及乘号用于自然语言说明，不是 ASCII 运算符。
allowed-confusables = ["：", "，", "；", "（", "）", "×", "σ", "′"]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
