name: CI
on: [push, pull_request]
jobs:
  public:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]" ruff build twine
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy --ignore-missing-imports --disallow-untyped-defs src/openpt
      - run: python -m pytest -m "not internal"
      - run: python -m build
      - run: python -m twine check dist/*
  r-crosscheck:
    # 阶段性检查：尚非完整 T20b 对照，不能作为发布验收证据。
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -m r
      # 当前严格零值相对误差已知有差异，作业继续允许失败，不能作放行证据。
      - run: python validation/run_r_crosscheck.py
