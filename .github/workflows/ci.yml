name: CI
on: [push, pull_request]
jobs:
  public:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]" ruff build twine
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy --ignore-missing-imports --disallow-untyped-defs src/openpt
      - run: python tools/generate_reference.py --check
      - run: python -m pytest -m "not internal"
      - run: python -m build
      - run: python -m twine check dist/*
  r-crosscheck:
    # 独立对照是 CI 门槛；未覆盖接口仍须另行验证。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
      - run: python -m pip install -e ".[test]" "hypothesis==6.170.15"
      - run: python -m pytest -m r
      # 仅允许清单中满足具体条件的已知差异。
      - run: python validation/run_r_crosscheck.py
