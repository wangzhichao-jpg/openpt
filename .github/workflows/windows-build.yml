name: Windows portable build
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/windows-build.yml'
      - 'windows/**'
      - 'src/openpt/windows_app.py'
      - 'src/openpt/runs.py'
      - 'pyproject.toml'
      - 'README.md'
      - 'docs/使用手册.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY_LICENSES.md'

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install . "pyinstaller==6.16.0"
      - name: Build windowed onedir
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --noupx --onedir --windowed --name OpenPT --collect-data openpt --copy-metadata numpy --copy-metadata scipy --copy-metadata openpyxl --copy-metadata python-docx --add-data 'windows/甲醛示例.xlsx;windows' windows/launch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LICENSE,NOTICE,THIRD_PARTY_LICENSES.md,docs/使用手册.md dist/OpenPT/
          python windows/collect_licenses.py dist/OpenPT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Start packaged GUI and calculate example
        shell: pwsh
        run: |
          $env:OPENPT_GUI_SMOKE_DIR = Join-Path $env:RUNNER_TEMP 'OpenPT 中文 空格'
          New-Item -ItemType Directory -Force $env:OPENPT_GUI_SMOKE_DIR | Out-Null
          $p = Start-Process -FilePath (Resolve-Path 'dist/OpenPT/OpenPT.exe') -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; throw 'GUI 冒烟超时' }
          if ($p.ExitCode -ne 0) { throw "GUI 冒烟失败：$($p.ExitCode)" }
          python windows/check_smoke.py $env:OPENPT_GUI_SMOKE_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist/OpenPT -DestinationPath OpenPT-Windows-x64.zip
          $hash = (Get-FileHash OpenPT-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  OpenPT-Windows-x64.zip" | Out-File -Encoding ascii OpenPT-Windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: OpenPT-Windows-x64
          path: |
            OpenPT-Windows-x64.zip
            OpenPT-Windows-x64.zip.sha256
          if-no-files-found: error
